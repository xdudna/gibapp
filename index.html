<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script>
      try {
        var opts = JSON.parse(localStorage.getItem('localOptions') || '{}');
        if (opts.darkMode) {
          document.documentElement.classList.add('dark');
          document.write('<style>body{background-color:#1a1a2e!important;color:#e0e0e0;}</style>');
        }
        // 转圈用用户自己的强调色，免得一个蓝 spinner 闪现在紫色主题的应用上。
        // 与 index.html 里那段是同一处理 —— 遮罩在 #app 外面，继承不到 .app-root 的变量。
        if (opts.accentColor) {
          document.documentElement.style.setProperty('--boot-accent', opts.accentColor);
        }
      } catch(e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 启动遮罩的样式与标记都不在这里手写第二份，而是由 encrypt-dist.mjs
         从源码 index.html 里按标记提取后注入。一份源、两处生效，样式不会跑偏。
         注意：注释里**不能**写出那两个占位符的字面名字（含双下划线的那串）。
         替换是全字符串替换，写在注释里也会被替掉，于是整块遮罩（连同它自己的
         注释）被注进这条注释内部，里面的结束标记会提前关掉它 —— 注释文字漏到页面上，
         而且遮罩会出现两份，getElementById 只藏得掉第一份，看上去就是永久卡在载入中。
         下面两处占位符是它们唯一该出现的位置。 -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg, #f8f9fb);
        color: #4a5366;
        /* 字体跟着应用走，系统栈只作兜底。这一段是内联样式，id 选择器压得过
           fonts.css 里那条 * 规则，所以这里必须自己把变量带上，否则文案会一直
           停在系统字体上。安全性来自文案的出现时机：初始留空（见下面
           .boot-loader__text），第一句由 js 在 applyGlobalTheme 之后才写进来，
           那时 --app-font 已经落在 root 上 —— 不存在「先系统字体、再换一次」。 */
        font-family: var(--app-font, system-ui), -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        transition: opacity 0.24s ease;
      }
      /* 底色走自定义属性，深色主题只改这一个值：
         收尾是整层淡出，不再需要把 background 单独改成 transparent。 */
      html.dark #boot-loader {
        --boot-bg: #1a1a2e;
        color: #b9c0cc;
      }
      /* ── 底版 ────────────────────────────────────────────────────────────
         与欢迎页（Guide.vue）同一套：暗角 + 左右两团强调色雾 + 冷调渐变 +
         一层四周淡出的点阵。它在这里被重写一遍，原因很实在 —— 遮罩是纯静态
         HTML，比 Vue 早、也在 Vue 之外，拿不到那张卡片的样式。
         这一层现在不只是好看：从欢迎页点「进入」时，两张页面的底必须对得上，
         遮罩才能不淡入、直接把换页那一帧盖掉（见下面 is-entering 那段）。
         所以颜色、光斑位置、点阵间距都跟 Guide.vue 那一份保持一致；改一边
         就要改另一边，否则交接时会看见底跳一下。
         没有光斑的漂移：这一层通常只存在一两秒，动起来更像卡住。 */
      .boot-loader__scene {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(135% 125% at 50% 44%, transparent 42%, rgba(23, 43, 77, 0.06) 100%),
          linear-gradient(160deg, #e8f1fb 0%, #d5e4f7 50%, #c2d6f0 100%);
      }
      /* 光斑与那两团大范围的强调色雾单独成元素、颜色走 color-mix：
         color-mix 不可用时这里整条声明作废，只是没有强调色，底色照旧；
         若把强调色写进 .boot-loader__scene 那条 background 里当第二份声明，
         不支持时会把整个 background 一起判废（同一属性后写的赢），底就没了。 */
      .boot-loader__glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 6% 0%, color-mix(in srgb, var(--boot-accent, #3399cc) 18%, transparent), transparent 58%),
          radial-gradient(110% 90% at 94% 100%, color-mix(in srgb, var(--boot-accent, #3399cc) 18%, transparent), transparent 60%);
      }
      .boot-loader__blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(56px);
      }
      .boot-loader__blob--a {
        top: -16vmax;
        left: -10vmax;
        width: 46vmax;
        height: 46vmax;
        background: radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--boot-accent, #3399cc) 32%, transparent), transparent 68%);
      }
      .boot-loader__blob--b {
        right: -14vmax;
        bottom: -20vmax;
        width: 52vmax;
        height: 52vmax;
        background: radial-gradient(circle at 55% 45%, color-mix(in srgb, var(--boot-accent, #3399cc) 32%, transparent), transparent 66%);
      }
      .boot-loader__blob--c {
        top: 26%;
        right: 18%;
        width: 22vmax;
        height: 22vmax;
        background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--boot-accent, #3399cc) 18%, transparent), transparent 70%);
      }
      .boot-loader__scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(30, 41, 59, 0.2) 1px, transparent 1.1px);
        background-size: 20px 20px;
        opacity: 0.55;
        -webkit-mask-image: radial-gradient(ellipse 64% 58% at 50% 50%, #000 0%, transparent 76%);
        mask-image: radial-gradient(ellipse 64% 58% at 50% 50%, #000 0%, transparent 76%);
      }
      html.dark .boot-loader__scene {
        background:
          radial-gradient(135% 125% at 50% 44%, transparent 42%, rgba(0, 0, 0, 0.38) 100%),
          linear-gradient(160deg, #1b1e2b 0%, #191c28 52%, #151822 100%);
      }
      html.dark .boot-loader__scene::after {
        background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1.1px);
        opacity: 0.4;
      }
      html.dark .boot-loader__blob {
        opacity: 0.75;
      }

      /* ── 从欢迎页点「进入」进来的那一轮 ──────────────────────────────────
         欢迎页那边先把卡片糊掉再走（Guide.vue 的 .guide--leaving），这里接着
         这口气：内容从模糊变清楚。
         遮罩本身不做淡入（transition: none）—— 它背后那一帧已经在换成 /main
         了，淡入会把那张页面露出来。两层底一致，于是换页这一步被藏在失焦里：
         看到的只是一片「糊」，然后对焦到加载页。
         时长与 Guide 那段退场（0.4s）是连着的两半，别单独改。 */
      #boot-loader.is-entering {
        transition: none;
      }
      #boot-loader.is-entering .boot-loader__mark,
      #boot-loader.is-entering .boot-loader__text {
        animation: boot-focus-in 0.52s cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }
      @keyframes boot-focus-in {
        from {
          opacity: 0;
          filter: blur(14px);
          transform: scale(1.06);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: none;
        }
      }

      #boot-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* 遮罩上那一行阶段文案。
         绝对定位而不是跟着 flex 排版：#boot-loader 是 column + 居中，文字若参与
         排版会把那枚 64px 的圈连带顶上去十几像素，圈与图标就不在同一个圆心上了。
         44 = 圈半径 32 + 12 间距，所以它始终贴在圈的正下方。
         top 用 50% 而不是 center：这个盒子的定位基准是铺满整屏的 #boot-loader，
         50% 就是屏幕中线，也就是圈的圆心。 */
      .boot-loader__text {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + 44px);
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.02em;
        /* 比转圈弱一档：它是说明，不是主角。颜色继承 #boot-loader 的前景色，
           再用透明度压下去 —— 深色模式下两个主题各自给的那档前景色都还在。 */
        opacity: 0.72;
        /* 换文案时不要抖动：文案宽度不一，居中定位本身不抖，但行高要钉住 */
        line-height: 1.4;
        white-space: nowrap;
      }

      .boot-loader__mark {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-loader__mark img {
        width: 32px;
        height: 32px;
      }
      /* 加载圈：主题色的一段弧在匀速自转（就是原来那个「转圈」）。
         用 SVG 而不是 border 技巧，是为了下一拍 —— 就绪时要把这段弧**补齐成整圈**，
         弧长得能连续变化；border 只能染出固定的一段，做不到这件事。
         长度单位：circle 上写了 pathLength="100"（见 HTML 块），
         于是「四分之一圈」就是「实线 25、空 75」，比写 2πr≈188.5 直观得多。 */
      .boot-loader__ring {
        position: absolute;
        inset: 0;
        width: 64px;
        height: 64px;
        border-radius: 50%;
      }
      .boot-loader__track {
        fill: none;
        stroke: rgba(128, 128, 128, 0.18);
        stroke-width: 3;
      }
      .boot-loader__fill {
        fill: none;
        stroke: var(--boot-accent, #409eff);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 25 75;
        /* 绕自己圆心转。SVG 元素的 transform-origin 默认参考 viewBox，
           写 fill-box + center 更直接：绕这一条弧自己的中心转，与 viewBox 无关 */
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-spin 1.1s linear infinite;
        /* 就绪后只改下面那两个值，走过渡而不是关键帧：
           关键帧会从固定起点重放，过渡才能从「此刻画到哪儿」自然接上。
           时长必须与 src/utils/bootLoader.js 里的 COMPLETE_MS 一致。 */
        transition: stroke-dasharray 0.6s ease-in-out, stroke 0.6s ease-in-out;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      /* ── 就绪：慢慢把弧补齐成整圈，并在补齐的过程中变绿 ──────────────────
         绿 = 「好了」，与页脚那条成功回执是同一套语义。
         绿色 #4f9d2f：浅底 3.22:1、深底 5.03:1，都过 WCAG 图形对比度的 3:1，
         所以两种主题共用这一个值，不必再写深色变体。
         自转不停：补齐的同时还在转，弧看起来是「边转边合拢」。
         转到后来整圈合上了，转不转也就看不出来了，所以不用专门去停。
         另外加一圈很淡的光晕，「亮了」这件事才不只是颜色变化。 */
      #boot-loader.is-done .boot-loader__fill {
        stroke: #4f9d2f;
        stroke-dasharray: 100 0;
      }
      #boot-loader.is-done .boot-loader__ring {
        box-shadow: 0 0 0 5px rgba(79, 157, 47, 0.16);
        transition: box-shadow 0.6s ease-in-out;
      }

      /* ── 收尾：整层淡出，页面在下面同时淡入 ──────────────────────────────
         没有撑开的圈，也没有单独让位的元素：图标、弧、文案、底版一起消失，
         「加载完了」这件事只由「旧的一层退、新的一层进」说完。
         退的是整层 opacity。只退底色在这里等于没退 —— 底版铺满整屏，
         底色本来就被它盖着（早先那版是靠圈撑开来遮住过程的，现在没有圈了）。
         时长与 bootLoader.js 里的 FADE_MS 一致。 */
      #boot-loader.is-revealing {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.36s ease;
      }

      /* 页面这边同时落定，比遮罩的淡出稍长一点，收在遮罩消失之后：
         两段一起停会显得「两边都还在动」，错开才有「旧的走了、新的立住」。
         这里**不带 opacity**：页面就在遮罩下面，遮罩一淡它自然会露出来；
         两头都做淡入淡出，中段两层都半透明，衬在 body 底色上会发灰。
         起点 1.015 是**放大**，所以内容是「收回来」的。
         代价是文档会短暂多出约 0.75vh 的可滚动溢出（transform 不影响布局，
         但算作可滚动溢出），所以下面要锁一下滚动，见 html.is-boot-revealing。 */
      #app.is-booting-in {
        animation: boot-page-in 0.42s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      @keyframes boot-page-in {
        0% {
          transform: scale(1.015);
        }
        100% {
          transform: scale(1);
        }
      }

      /* 收尾这 0.42s 锁住文档滚动。
         上面 #app 放大到 1.015，纵向会溢出视口约 0.75vh —— 视口右侧会闪出一条
         纵向滚动条，内容跟着横移十几像素，比动效本身还显眼。
         应用本身是 100vh + 内部滚动，文档层本来就没有可滚的东西，
         锁这一下不会挡住任何操作；而且它只在这 0.42s 内存在。
         由 bootLoader.js 在收尾开始时挂上、进场结束时摘掉。 */
      html.is-boot-revealing,
      html.is-boot-revealing body {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        /* 转圈与补齐都是动效。这里只放慢，不取消 ——
           它是加载中唯一的反馈，取消了就成了完全不动的画面。
           （JS 侧对减动效会直接淡出，不会等这个补齐） */
        .boot-loader__fill {
          animation-duration: 2.6s;
          transition: none;
        }
        #app.is-booting-in {
          animation: none;
        }
        /* 「对焦」是纯粹的装饰，减动效下不做：内容直接以清楚的状态出现。
           Guide 那边也是同一条取舍（不排退场，立刻跳转）。 */
        #boot-loader.is-entering .boot-loader__mark,
        #boot-loader.is-entering .boot-loader__text {
          animation: none;
        }
      }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#1a1a2e] min-h-screen">
    <div id="gate" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:100000;display:none"
         class="bg-gray-50 dark:bg-[#1a1a2e] flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-white dark:bg-[#252536] rounded-xl shadow-lg p-8">
        <h1 class="text-xl font-bold mb-5 text-gray-700 dark:text-gray-200">请输入口令</h1>
        <input id="gate-input" type="password" autocomplete="current-password" spellcheck="false"
               class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-transparent text-gray-800 dark:text-gray-100 outline-none focus:border-[#3399cc]">
        <button id="gate-btn"
                class="w-full mt-3 px-4 py-2 rounded bg-[#3399cc] text-white hover:opacity-90 disabled:opacity-50">解锁</button>
        <div id="gate-msg" class="mt-3 text-sm text-red-500" style="min-height:1.25rem"></div>
        <div class="mt-2 text-[11px] text-gray-300 dark:text-gray-600 text-right">REL_20261021_192929_FE268AD6</div>
      </div>
    </div>
    <div id="app" class="dark:bg-[#1a1a2e]"></div>

    <!-- 启动遮罩（由 encrypt-dist.mjs 从源码 index.html 提取注入）。
         为什么线上需要它：解锁成功后口令会存进 IndexedDB，之后每次打开都走
         「已存密钥」那条分支 —— 那条分支不显示口令卡片，而 PBKDF2 60 万次派生
         ＋拉取并解密两份 .enc 要一两秒，这段时间页面上原本**什么都没有**。
         现在遮罩从第一帧就在，口令卡片出现时它的不透明底会把遮罩盖住，
         应用挂载后由 bundle 里的 bootLoader.js 把它淡出。 -->
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading">
      <!-- 底版：与欢迎页同一套底（渐变 + 三团光斑 + 点阵），收尾时整层跟着淡出。
           光斑是三个元素而不是 CSS 里的伪元素，位置与 Guide.vue 里那三个一一对应；
           它们不漂移，理由见样式里那段注释。 -->
      <div class="boot-loader__scene" aria-hidden="true">
        <span class="boot-loader__glow"></span>
        <span class="boot-loader__blob boot-loader__blob--a"></span>
        <span class="boot-loader__blob boot-loader__blob--b"></span>
        <span class="boot-loader__blob boot-loader__blob--c"></span>
      </div>
      <div class="boot-loader__mark">
        <img src="./favicon.ico" alt="" />
        <svg class="boot-loader__ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="boot-loader__track" cx="32" cy="32" r="30"></circle>
          <!-- pathLength="100" 把周长归一化成 100：
               于是 CSS 里「四分之一圈」就是 stroke-dasharray: 25 75，
               不必去算 2πr，改半径也不用回来重算 -->
          <circle class="boot-loader__fill" cx="32" cy="32" r="30" pathLength="100"></circle>
        </svg>
      </div>
      <!-- 遮罩上的那一行字。阶段由 js 按**真实**的推进改（见 utils/bootLoader.js）。
           初始**刻意留空**：这层 HTML 先于任何样式表和脚本解析出来，那会儿应用的
           字体还没落到 root 上（--app-font 要等 applyGlobalTheme），此刻写字等于先按
           兜底的系统字体画一遍、等应用字体上来再换一次 —— 同一句话被重画两遍，
           比晚一点出现显眼得多（早先这里写死「正在获取页面…」，看到的就是这个）。
           首句改由 js 写：main.js 在 applyGlobalTheme 之后、mount 之前写下
           「正在获取页面…」，那之后是「正在读取数据…」「正在检查数据版本…」……
           在它写进来之前，这一层只有图标和转圈。
           它绝对定位、不参与居中排版 —— 参与的话会把上面那枚 64px 的圈顶上去，
           圈与图标就不同心了。 -->
      <div class="boot-loader__text" id="boot-loader-text"></div>
    </div>

    <script>
      // ── 由 scripts/encrypt-dist.mjs 在构建时替换的常量 ───────────────────────
      var JS_ENC = "./assets/index-1710f187.js.enc";
      var CSS_ENC = "./assets/index-ea51c57d.css.enc";
      var SALT_B64 = "Z2liLWhlbHBlci1nYXRlMQ==";
      var ITERATIONS = 600000;
      // ─────────────────────────────────────────────────────────────────────

      var gate = document.getElementById("gate");
      var input = document.getElementById("gate-input");
      var btn = document.getElementById("gate-btn");
      var msg = document.getElementById("gate-msg");

      var DB_NAME = "appGate", STORE = "keys", KEY_ID = "key";

      var setMsg = function (text, isError) {
        msg.textContent = text;
        msg.className = isError ? "mt-3 text-sm text-red-500" : "mt-3 text-sm text-gray-500";
      };

      var b64ToBytes = function (b64) {
        var bin = atob(b64), out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      };

      var openDb = function () {
        return new Promise(function (resolve, reject) {
          var req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      };

      var dbGet = function (key) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var r = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
            r.onsuccess = function () { resolve(r.result); };
            r.onerror = function () { reject(r.error); };
          });
        });
      };

      var dbPut = function (key, value) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE, "readwrite");
            tx.objectStore(STORE).put(value, key);
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        });
      };

      var dbDel = function (key) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE, "readwrite");
            tx.objectStore(STORE).delete(key);
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        });
      };

      var deriveKey = function (passphrase) {
        var enc = new TextEncoder();
        return crypto.subtle
          .importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"])
          .then(function (base) {
            return crypto.subtle.deriveKey(
              { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: "SHA-256" },
              base,
              // extractable=false：即使存进 IndexedDB，JS 也导不回密钥原始字节
              { name: "AES-GCM", length: 256 },
              false,
              ["decrypt"]
            );
          });
      };

      // 密文布局：前 12 字节是本次加密的随机 IV，其余是 GCM 密文（含 16 字节认证标签）
      var fetchDecrypt = function (key, url) {
        return fetch(url, { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("无法获取加密资源 " + url + "（HTTP " + res.status + "）");
            return res.arrayBuffer();
          })
          .then(function (buf) {
            var all = new Uint8Array(buf);
            var iv = all.subarray(0, 12);
            return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, all.subarray(12));
          })
          .then(function (plain) { return new TextDecoder().decode(plain); });
      };

      var removeGateWhenMounted = function () {
        var app = document.getElementById("app");
        var started = Date.now();
        var tick = function () {
          if ((app && app.childElementCount > 0) || Date.now() - started > 3000) {
            gate.remove();
            return;
          }
          setTimeout(tick, 50);
        };
        tick();
      };

      // 先干净地解密两份资源，全部成功后才注入任何东西：
      // 口令错误时页面保持原样，不会留下半成品状态
      var unlock = function (key, persist) {
        return Promise.all([fetchDecrypt(key, CSS_ENC), fetchDecrypt(key, JS_ENC)]).then(function (parts) {
          var style = document.createElement("style");
          style.textContent = parts[0];
          document.head.appendChild(style);

          var script = document.createElement("script");
          // 用 module 而非 classic script：bundle 里可能有 import.meta，在非模块里是语法错误
          script.type = "module";
          // 用 textContent 而非 HTML 字符串拼接：不会被 HTML 解析破坏
          script.textContent = parts[1];
          document.head.appendChild(script);

          removeGateWhenMounted();

          return persist
            ? dbPut(KEY_ID, key).catch(function (e) {
                console.warn("口令记忆失败，下次仍需输入：", e);
              })
            : null;
        });
      };

      var submit = function () {
        var pass = input.value;
        if (!pass) return;
        btn.disabled = true;
        input.disabled = true;
        setMsg("正在解密…", false);
        deriveKey(pass)
          .then(function (key) { return unlock(key, true); })
          .then(function () {})
          .catch(function (e) {
            // 口令错误与密文被篡改都表现为 OperationError
            setMsg("口令错误", true);
            input.value = "";
            input.focus();
            console.error("解锁失败：", e);
          })
          .then(function () {
            btn.disabled = false;
            input.disabled = false;
          });
      };

      var showGate = function () {
        gate.style.display = "";
        if (input) { input.focus(); }
        btn.addEventListener("click", submit);
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      };

      var startup = function () {
        if (!window.crypto || !crypto.subtle) {
          showGate();
          setMsg("当前环境不支持 WebCrypto，需要通过 https 或 localhost 访问", true);
          return;
        }
        dbGet(KEY_ID)
          .catch(function (e) { console.warn("读取已存密钥失败：", e); return null; })
          .then(function (stored) {
            if (!stored) { showGate(); return; }
            return unlock(stored, false).catch(function () {
              // 密钥失效或密文已换（重新构建过），清掉重来
              return dbDel(KEY_ID).catch(function () {}).then(showGate);
            });
          })
          .catch(function (e) {
            console.error("启动失败：", e);
            showGate();
            setMsg("启动失败：" + (e && e.message ? e.message : e), true);
          });
      };

      startup();
    </script>
</body>
</html>

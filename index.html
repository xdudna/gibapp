<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script>
      try {
        var opts = JSON.parse(localStorage.getItem('localOptions') || '{}');
        if (opts.darkMode) {
          document.documentElement.classList.add('dark');
          document.write('<style>body{background-color:#1a1a2e!important;color:#e0e0e0;}</style>');
        }
        // 转圈用用户自己的强调色，免得一个蓝 spinner 闪现在紫色主题的应用上。
        // 与 index.html 里那段是同一处理 —— 遮罩在 #app 外面，继承不到 .app-root 的变量。
        if (opts.accentColor) {
          document.documentElement.style.setProperty('--boot-accent', opts.accentColor);
        }
      } catch(e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 启动遮罩的样式与标记都不在这里手写第二份，而是由 encrypt-dist.mjs
         从源码 index.html 里按标记提取后注入。一份源、两处生效，样式不会跑偏。
         注意：注释里**不能**写出那两个占位符的字面名字（含双下划线的那串）。
         替换是全字符串替换，写在注释里也会被替掉，于是整块遮罩（连同它自己的
         注释）被注进这条注释内部，里面的结束标记会提前关掉它 —— 注释文字漏到页面上，
         而且遮罩会出现两份，getElementById 只藏得掉第一份，看上去就是永久卡在载入中。
         下面两处占位符是它们唯一该出现的位置。 -->
    <!-- 登录门（#gate）的样式。它与启动遮罩共用同一套底版
         （.boot-loader__scene 等，那份样式从源码注入），所以这里只管卡片本身：
         首帧即成型的手写样式，不依赖 Tailwind 的运行时 JIT。 -->
    <style>
      #gate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100000;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: hidden;
        background: #f8f9fb;
      }
      html.dark #gate { background: #1a1a2e; }

      .gate-card {
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        width: 100%;
        max-width: 384px;
        padding: 34px 30px 22px;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 22px 60px -18px rgba(31, 52, 87, 0.3), 0 3px 10px rgba(31, 52, 87, 0.05);
        -webkit-backdrop-filter: blur(22px) saturate(145%);
        backdrop-filter: blur(22px) saturate(145%);
      }
      html.dark .gate-card {
        border-color: rgba(255, 255, 255, 0.09);
        background: rgba(37, 37, 54, 0.9);
        box-shadow: 0 22px 60px -18px rgba(0, 0, 0, 0.55);
      }

      .gate-brand {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        border: 1px solid rgba(255, 255, 255, 0.92);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 8px 22px -8px rgba(51, 153, 204, 0.65);
        box-shadow: 0 8px 22px -8px color-mix(in srgb, var(--boot-accent, #3399cc) 65%, transparent);
      }
      .gate-brand::after {
        content: "";
        position: absolute;
        inset: -6px;
        border: 1px solid rgba(51, 153, 204, 0.28);
        border: 1px solid color-mix(in srgb, var(--boot-accent, #3399cc) 30%, transparent);
        border-radius: 22px;
      }
      .gate-brand img { width: 32px; height: 32px; }
      html.dark .gate-brand {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.07);
      }

      .gate-title {
        margin: 0;
        text-align: center;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #2b3448;
      }
      html.dark .gate-title { color: #e8ebf2; }
      .gate-subtitle {
        margin: 7px 0 24px;
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
        color: #7c8799;
      }
      html.dark .gate-subtitle { color: #99a2b4; }

      .gate-field { position: relative; }
      .gate-field > .fa-lock {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
        color: #a6b0c0;
        pointer-events: none;
      }
      .gate-input {
        box-sizing: border-box;
        width: 100%;
        height: 46px;
        padding: 0 44px 0 40px;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.02em;
        color: #2b3448;
        background: rgba(245, 248, 252, 0.92);
        border: 1px solid rgba(120, 140, 170, 0.26);
        border-radius: 12px;
        outline: none;
        transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
      }
      html.dark .gate-input {
        color: #e8ebf2;
        background: rgba(12, 13, 22, 0.5);
        border-color: rgba(255, 255, 255, 0.13);
      }
      .gate-input::placeholder { color: #aeb7c5; opacity: 1; }
      .gate-input:focus {
        background: #fff;
        border-color: var(--boot-accent, #3399cc);
        box-shadow: 0 0 0 4px rgba(51, 153, 204, 0.16);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--boot-accent, #3399cc) 16%, transparent);
      }
      html.dark .gate-input:focus { background: rgba(12, 13, 22, 0.72); }
      .gate-input:disabled { opacity: 0.55; }

      .gate-toggle {
        position: absolute;
        right: 7px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #a6b0c0;
        cursor: pointer;
        transition: color 0.16s, background 0.16s;
      }
      .gate-toggle:hover { color: #5c6779; background: rgba(120, 140, 170, 0.12); }
      html.dark .gate-toggle:hover { color: #cfd6e3; background: rgba(255, 255, 255, 0.08); }

      .gate-btn {
        box-sizing: border-box;
        width: 100%;
        height: 46px;
        margin-top: 14px;
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: #fff;
        background: var(--boot-accent, #3399cc);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 8px 20px -8px rgba(51, 153, 204, 0.7);
        box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--boot-accent, #3399cc) 70%, transparent);
        transition: filter 0.18s, transform 0.12s;
      }
      .gate-btn:hover { filter: brightness(1.08); }
      .gate-btn:active { transform: translateY(1px); }
      .gate-btn:disabled { opacity: 0.62; cursor: wait; }

      .gate-msg {
        min-height: 18px;
        margin-top: 13px;
        text-align: center;
        font-size: 13px;
        line-height: 1.4;
        color: #7c8799;
      }
      html.dark .gate-msg { color: #99a2b4; }
      .gate-msg.gate-msg--error { color: #d84545; }
      html.dark .gate-msg.gate-msg--error { color: #ff8080; }

      .gate-stamp {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid rgba(120, 140, 170, 0.16);
        text-align: right;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.02em;
        color: #b1bac8;
      }
      html.dark .gate-stamp {
        border-top-color: rgba(255, 255, 255, 0.08);
        color: #6c7586;
      }

      /* ── 周边装饰：卡片两侧各一组轨道线稿，填掉那一大片净色 ──────────────
         纯 SVG + currentColor，没有额外的图片请求：离线能用、换强调色会跟着变。
         它铺在底版之上、卡片之下；卡片是毛玻璃，背后透出一点线正好添层次。
         色阶用元素上的 opacity 分级，深浅主题只调整体透明度，不另写一套颜色。 */
      .gate-decor {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .gate-decor__side {
        position: absolute;
        top: 50%;
        width: min(36vw, 440px);
        height: min(78vh, 660px);
        color: var(--boot-accent, #3399cc);
        transform: translateY(-50%);
        /* 外圈几个大圆/椭圆半径超过 viewBox 的 200，SVG 默认会把它们裁在
           viewBox 边界上、留下一条被切平的弧。让内容溢出 viewBox 画完整；
           屏幕边缘由外层 .gate-decor 的 overflow:hidden 兜住，不会真溢出屏幕。 */
        overflow: visible;
      }
      .gate-decor__side--left { left: -3vw; }
      /* 右侧直接镜像复用同一份线稿，省一份维护，也天然左右对称 */
      .gate-decor__side--right {
        right: -3vw;
        transform: translateY(-50%) scaleX(-1);
      }
      .gate-decor__side .ln { fill: none; stroke: currentColor; }
      .gate-decor__side .dot { fill: currentColor; }
      .gate-decor__side .accent { fill: currentColor; }
      html.dark .gate-decor__side { opacity: 0.92; }
      /* 窄屏把装饰压暗让位给卡片，只留一点余韵，别在输入框背后晃 */
      @media (max-width: 900px) {
        .gate-decor__side { opacity: 0.32; }
      }
      @media (max-width: 560px) {
        .gate-decor__side { opacity: 0.16; }
      }
      @keyframes gate-orbit {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .gate-decor__side .g-spin {
          transform-box: view-box;
          transform-origin: 200px 320px;
          animation: gate-orbit 90s linear infinite;
        }
      }
    </style>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg, #f8f9fb);
        color: #4a5366;
        /* 字体跟着应用走，系统栈只作兜底。这一段是内联样式，id 选择器压得过
           fonts.css 里那条 * 规则，所以这里必须自己把变量带上，否则文案会一直
           停在系统字体上。安全性来自文案的出现时机：初始留空（见下面
           .boot-loader__text），第一句由 js 在 applyGlobalTheme 之后才写进来，
           那时 --app-font 已经落在 root 上 —— 不存在「先系统字体、再换一次」。 */
        font-family: var(--app-font, system-ui), -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        transition: opacity 0.24s ease;
      }
      /* 底色走自定义属性，深色主题只改这一个值：
         收尾是整层淡出，不再需要把 background 单独改成 transparent。 */
      html.dark #boot-loader {
        --boot-bg: #1a1a2e;
        color: #b9c0cc;
      }
      /* ── 底版 ────────────────────────────────────────────────────────────
         与欢迎页（Guide.vue）同一套：暗角 + 左右两团强调色雾 + 冷调渐变 +
         一层四周淡出的点阵。它在这里被重写一遍，原因很实在 —— 遮罩是纯静态
         HTML，比 Vue 早、也在 Vue 之外，拿不到那张卡片的样式。
         这一层现在不只是好看：从欢迎页点「进入」时，两张页面的底必须对得上，
         遮罩才能不淡入、直接把换页那一帧盖掉（见下面 is-entering 那段）。
         所以颜色、光斑位置、点阵间距都跟 Guide.vue 那一份保持一致；改一边
         就要改另一边，否则交接时会看见底跳一下。
         没有光斑的漂移：这一层通常只存在一两秒，动起来更像卡住。 */
      .boot-loader__scene {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(135% 125% at 50% 44%, transparent 42%, rgba(23, 43, 77, 0.06) 100%),
          linear-gradient(160deg, #e8f1fb 0%, #d5e4f7 50%, #c2d6f0 100%);
      }
      /* 光斑与那两团大范围的强调色雾单独成元素、颜色走 color-mix：
         color-mix 不可用时这里整条声明作废，只是没有强调色，底色照旧；
         若把强调色写进 .boot-loader__scene 那条 background 里当第二份声明，
         不支持时会把整个 background 一起判废（同一属性后写的赢），底就没了。 */
      .boot-loader__glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 6% 0%, color-mix(in srgb, var(--boot-accent, #3399cc) 18%, transparent), transparent 58%),
          radial-gradient(110% 90% at 94% 100%, color-mix(in srgb, var(--boot-accent, #3399cc) 18%, transparent), transparent 60%);
      }
      .boot-loader__blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(56px);
      }
      .boot-loader__blob--a {
        top: -16vmax;
        left: -10vmax;
        width: 46vmax;
        height: 46vmax;
        background: radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--boot-accent, #3399cc) 32%, transparent), transparent 68%);
      }
      .boot-loader__blob--b {
        right: -14vmax;
        bottom: -20vmax;
        width: 52vmax;
        height: 52vmax;
        background: radial-gradient(circle at 55% 45%, color-mix(in srgb, var(--boot-accent, #3399cc) 32%, transparent), transparent 66%);
      }
      .boot-loader__blob--c {
        top: 26%;
        right: 18%;
        width: 22vmax;
        height: 22vmax;
        background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--boot-accent, #3399cc) 18%, transparent), transparent 70%);
      }
      .boot-loader__scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(30, 41, 59, 0.2) 1px, transparent 1.1px);
        background-size: 20px 20px;
        opacity: 0.55;
        -webkit-mask-image: radial-gradient(ellipse 64% 58% at 50% 50%, #000 0%, transparent 76%);
        mask-image: radial-gradient(ellipse 64% 58% at 50% 50%, #000 0%, transparent 76%);
      }
      html.dark .boot-loader__scene {
        background:
          radial-gradient(135% 125% at 50% 44%, transparent 42%, rgba(0, 0, 0, 0.38) 100%),
          linear-gradient(160deg, #1b1e2b 0%, #191c28 52%, #151822 100%);
      }
      html.dark .boot-loader__scene::after {
        background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1.1px);
        opacity: 0.4;
      }
      html.dark .boot-loader__blob {
        opacity: 0.75;
      }

      /* ── 从欢迎页点「进入」进来的那一轮 ──────────────────────────────────
         欢迎页那边先把卡片糊掉再走（Guide.vue 的 .guide--leaving），这里接着
         这口气：内容从模糊变清楚。
         遮罩本身不做淡入（transition: none）—— 它背后那一帧已经在换成 /main
         了，淡入会把那张页面露出来。两层底一致，于是换页这一步被藏在失焦里：
         看到的只是一片「糊」，然后对焦到加载页。
         时长与 Guide 那段退场（0.4s）是连着的两半，别单独改。 */
      #boot-loader.is-entering {
        transition: none;
      }
      #boot-loader.is-entering .boot-loader__mark,
      #boot-loader.is-entering .boot-loader__text {
        animation: boot-focus-in 0.52s cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }
      @keyframes boot-focus-in {
        from {
          opacity: 0;
          filter: blur(14px);
          transform: scale(1.06);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: none;
        }
      }

      #boot-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* 遮罩上那一行阶段文案。
         跟着 flex 正常排版，跟在圆环+进度条下方 —— 之前用绝对定位钉在圈下方
         固定偏移，加了进度条之后就正好压在进度条上。现在整组一起居中，
         不会再重叠；文案宽度变化也不会顶动上面的内容（它是流式最后一行）。 */
      .boot-loader__text {
        margin-top: 16px;
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.02em;
        /* 它是说明，不是主角：继承前景色再压一档透明度，两套主题都适用 */
        opacity: 0.72;
        line-height: 1.4;
        white-space: nowrap;
        /* 关键：文案初始刻意留空（等字体加载完再写，避免先按兜底字体画一遍）。
           若不给高度，JS 写入第一句时这行从 0 撑到一行，整组在屏幕上跳一下、
           小人看着就像突然上移。钉住一行的高度，空着时也占位，写字不抖。
           em 跟随 font-size，改字号不用回来重算。 */
        min-height: 1.4em;
      }

      /* 迟迟查不完时递出来的「取消」。
         它用 hidden 属性控制显隐（见 bootLoader.js），默认的 [hidden]{display:none}
         会在它出现的那一刻多占一行、把垂直居中的整组连带小人一起顶上去。
         所以这里覆盖成「始终占位、只切可见性」：平时 visibility:hidden 占着位置，
         JS 摘掉 hidden 时按钮原地出现，布局纹丝不动。
         颜色继承 #boot-loader 的前景色、只改透明度，深色主题不用另写一份。 */
      .boot-loader__cancel {
        margin-top: 14px;
        padding: 5px 16px;
        font: inherit;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: inherit;
        opacity: 0.8;
        background: rgba(127, 127, 127, 0.14);
        border: 1px solid rgba(127, 127, 127, 0.34);
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
      }
      /* 盖掉浏览器默认的 [hidden]{display:none}：让它一直占着这一行的高度，
         只靠 visibility 切显隐。这样按钮出现/消失都不改变整组布局，小人不被顶动。 */
      .boot-loader__cancel[hidden] {
        display: inline-block;
        visibility: hidden;
      }
      .boot-loader__cancel:hover,
      .boot-loader__cancel:focus-visible {
        opacity: 1;
        background: rgba(127, 127, 127, 0.24);
        border-color: rgba(127, 127, 127, 0.5);
      }

      /* 加载元素整体放大 200%：小人 + 进度条 + 文案 + 取消一起缩放。
         transform 不改布局尺寸，所以在 flex 居中的 #boot-loader 里视觉仍居中；
         底版、轨道装饰、左上品牌条都不在这层里，保持原尺寸。 */
      .boot-loader__stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: scale(2);
        transition: opacity 0.24s ease;
      }
      /* 成功后加载元素退场、进入卡片上场。两者都绝对定位在遮罩正中，
         切换只是一组淡出、一组淡入，不发生布局跳动。 */
      #boot-loader.is-ready .boot-loader__stage {
        opacity: 0;
        pointer-events: none;
      }

      /* ── 成功后的元素：没有白卡，直接坐在渐变底上、排在小人周围 ────────── */
      .boot-ready {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-loader.is-ready .boot-ready {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 0.32s ease 0.1s;
      }
      /* 收尾/隐藏期间，成功画面必须连带失去指针事件。
         否则 is-ready 时给的 pointer-events:auto 会盖过父级 is-hidden 的 none，
         淡出后仍有一层透明的东西罩在页面上，底下按钮点不动。 */
      #boot-loader.is-revealing .boot-ready,
      #boot-loader.is-hidden .boot-ready {
        pointer-events: none;
      }
      .boot-ready__info {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(462px, 100%);
        text-align: center;
        transform: translateY(10px) scale(0.985);
        opacity: 0;
      }

        <svg class="boot-decor__side boot-decor__side--right" viewBox="0 0 400 640" xmlns="http://www.w3.org/2000/svg">
          <g class="ln" opacity="0.12" stroke-width="1">

          <circle class="ln" cx="200" cy="320" r="40" stroke-width="1" opacity="0.26" />
          <circle class="dot" cx="200" cy="320" r="7" opacity="0.45" />

      </div>
      <!-- 左上角品牌识别条，与进入页同款静态排版：Alpha //// Gamma / /// BETA ///。
           纯装饰，currentColor 跟随强调色，不接指针事件。 -->
      <div class="boot-wordmark" aria-hidden="true">
        <div class="boot-wordmark__words">
          <span class="boot-wordmark__word boot-wordmark__word--lead">Alpha</span>
          <span class="boot-wordmark__streak boot-wordmark__streak--top"></span>
          <span class="boot-wordmark__word boot-wordmark__word--gamma">Gamma</span>
          <span class="boot-wordmark__streak boot-wordmark__streak--left"></span>
          <span class="boot-wordmark__word boot-wordmark__word--beta">BETA</span>
          <span class="boot-wordmark__streak boot-wordmark__streak--right"></span>
        </div>
      </div>
      <!-- 加载元素整体（小人 + 进度条 + 文案 + 取消）包一层，统一放大 200%。
           底版和两侧轨道装饰不在这层里，不受影响。 -->
      <div class="boot-loader__stage">
      <div class="boot-loader__mark">
        <!-- logo 徽章脸：圆角方形描边 + 两个小竖点 + 一枚小三角。渐变取主题色兑白，
             换强调色时跟着走。 -->
        <svg class="boot-loader__face" viewBox="0 0 84 84" aria-hidden="true">
          <defs>
            <linearGradient id="boot-face-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--boot-accent, #409eff)" stop-opacity="0.45" />
              <stop offset="100%" stop-color="var(--boot-accent, #409eff)" stop-opacity="0.95" />
            </linearGradient>
          </defs>
          <!-- 外框做成 app logo 那种圆角方形徽章：外面一圈淡描边 + 里面一圈渐变主体 -->
          <rect x="10" y="10" width="64" height="64" rx="18" fill="none" stroke="var(--boot-accent, #409eff)" stroke-width="2" opacity="0.22" />
          <rect x="15" y="15" width="54" height="54" rx="15" fill="none" stroke="url(#boot-face-grad)" stroke-width="6" />
          <rect class="boot-eye boot-eye--l" x="34" y="37" width="5" height="12" rx="2.5" fill="var(--boot-accent, #409eff)" opacity="0.85" />
          <rect class="boot-eye boot-eye--r" x="45" y="37" width="5" height="12" rx="2.5" fill="var(--boot-accent, #409eff)" opacity="0.85" />
          <!-- 右下角的小三角点缀 -->
          <path d="M70 74l6-3-3-6z" fill="var(--boot-accent, #409eff)" opacity="0.5" />
        </svg>
        <!-- 胶囊进度条：18 格小方块依次流动，仅表示「进行中」，真实阶段见下方文案 -->
        <div class="boot-loader__progress" aria-hidden="true">
          <span class="boot-loader__cell" style="--i:0"></span><span class="boot-loader__cell" style="--i:1"></span>
          <span class="boot-loader__cell" style="--i:2"></span><span class="boot-loader__cell" style="--i:3"></span>
          <span class="boot-loader__cell" style="--i:4"></span><span class="boot-loader__cell" style="--i:5"></span>
          <span class="boot-loader__cell" style="--i:6"></span><span class="boot-loader__cell" style="--i:7"></span>
          <span class="boot-loader__cell" style="--i:8"></span><span class="boot-loader__cell" style="--i:9"></span>
          <span class="boot-loader__cell" style="--i:10"></span><span class="boot-loader__cell" style="--i:11"></span>
          <span class="boot-loader__cell" style="--i:12"></span><span class="boot-loader__cell" style="--i:13"></span>
          <span class="boot-loader__cell" style="--i:14"></span><span class="boot-loader__cell" style="--i:15"></span>
          <span class="boot-loader__cell" style="--i:16"></span><span class="boot-loader__cell" style="--i:17"></span>
        </div>
      </div>
      <!-- 遮罩上的那一行字。阶段由 js 按**真实**的推进改（见 utils/bootLoader.js）。
           初始**刻意留空**：这层 HTML 先于任何样式表和脚本解析出来，那会儿应用的
           字体还没落到 root 上（--app-font 要等 applyGlobalTheme），此刻写字等于先按
           兜底的系统字体画一遍、等应用字体上来再换一次 —— 同一句话被重画两遍，
           比晚一点出现显眼得多（早先这里写死「正在获取页面…」，看到的就是这个）。
           首句改由 js 写：main.js 在 applyGlobalTheme 之后、mount 之前写下
           「正在获取页面…」，那之后是「正在读取数据…」「正在检查数据版本…」……
           在它写进来之前，这一层只有 logo 徽章和进度条。
           它跟着 flex 正常排版（在 .boot-loader__stage 里），用 min-height 钉住
           一行高度 —— 空文案到有文案不会把上面那组顶上去。 -->
      <div class="boot-loader__text" id="boot-loader-text"></div>
      <!-- 检查卡住时才显示（5 秒后由 js 摘掉 hidden，见 utils/bootLoader.js）。
           它长在遮罩上而不是另起一层全屏蒙版：底下这层已经写着「正在检查数据版本」
           并在报耗时，再盖一层黑底只是在说同一件事。 -->
      <button class="boot-loader__cancel" id="boot-loader-cancel" type="button" hidden>取消</button>
      </div><!-- /.boot-loader__stage -->

      <!-- 加载成功后的「进入」卡片：与首页 Guide.vue 同一套视觉。
           默认隐藏（stage 在上面加载），成功时 bootLoader.js 给它挂 is-show，
           stage 退场、这张卡进场。appName / welcomeText / stamp 由 JS 在那一刻
           从本地数据与 buildStamp() 填入 —— 此刻 Vue 已挂载、字体已就位，
           不像首屏那样有「先画一遍兜底字体」的问题。点「进入」才真正收遮罩进主页面。 -->
      <div class="boot-ready" id="boot-ready" aria-hidden="true">
        <div class="boot-ready__info">
          <!-- 与加载时同一个徽章小人（圆角方形 + 两竖点 + 小三角），成功后原样保留，
               不再换成 favicon 小人头。形状/配色与 stage 里那份一致，衔接不跳。 -->
          <svg class="boot-ready__face" viewBox="0 0 84 84" aria-hidden="true">
            <!-- 复用 stage 徽章那份渐变（页面里已有一份 boot-face-grad，id 全局唯一，
                 这里直接引用，不再重复定义 defs） -->
            <rect x="10" y="10" width="64" height="64" rx="18" fill="none" stroke="var(--boot-accent, #409eff)" stroke-width="2" opacity="0.22" />
            <rect x="15" y="15" width="54" height="54" rx="15" fill="none" stroke="url(#boot-face-grad)" stroke-width="6" />
            <rect class="boot-eye boot-eye--l" x="34" y="37" width="5" height="12" rx="2.5" fill="var(--boot-accent, #409eff)" opacity="0.85" />
            <rect class="boot-eye boot-eye--r" x="45" y="37" width="5" height="12" rx="2.5" fill="var(--boot-accent, #409eff)" opacity="0.85" />
            <path d="M70 74l6-3-3-6z" fill="var(--boot-accent, #409eff)" opacity="0.5" />
          </svg>
          <p class="boot-ready__brand" id="boot-ready-brand"></p>
          <h1 class="boot-ready__title" id="boot-ready-title"></h1>
          <button type="button" class="boot-ready__enter" id="boot-ready-enter">
            <span>进入</span>
            <svg class="boot-ready__arrow" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 8h10M8.2 4 12.2 8l-4 4" />
            </svg>
          </button>
          <p class="boot-ready__stamp" id="boot-ready-stamp"></p>
        </div>
      </div>
    </div>

    <script>
      // ── 由 scripts/encrypt-dist.mjs 在构建时替换的常量 ───────────────────────
      var JS_ENC = "./assets/index-8224f5fa.js.enc";
      var CSS_ENC = "./assets/index-cfcd77e3.css.enc";
      var SALT_B64 = "Z2liLWhlbHBlci1nYXRlMQ==";
      var ITERATIONS = 600000;
      // ─────────────────────────────────────────────────────────────────────

      var gate = document.getElementById("gate");
      var input = document.getElementById("gate-input");
      var btn = document.getElementById("gate-btn");
      var msg = document.getElementById("gate-msg");

      var DB_NAME = "appGate", STORE = "keys", KEY_ID = "key";

      var setMsg = function (text, isError) {
        msg.textContent = text;
        msg.className = isError ? "gate-msg gate-msg--error" : "gate-msg";
      };

      var b64ToBytes = function (b64) {
        var bin = atob(b64), out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      };

      var openDb = function () {
        return new Promise(function (resolve, reject) {
          var req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      };

      var dbGet = function (key) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var r = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
            r.onsuccess = function () { resolve(r.result); };
            r.onerror = function () { reject(r.error); };
          });
        });
      };

      var dbPut = function (key, value) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE, "readwrite");
            tx.objectStore(STORE).put(value, key);
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        });
      };

      var dbDel = function (key) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE, "readwrite");
            tx.objectStore(STORE).delete(key);
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        });
      };

      var deriveKey = function (passphrase) {
        var enc = new TextEncoder();
        return crypto.subtle
          .importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"])
          .then(function (base) {
            return crypto.subtle.deriveKey(
              { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: "SHA-256" },
              base,
              // extractable=false：即使存进 IndexedDB，JS 也导不回密钥原始字节
              { name: "AES-GCM", length: 256 },
              false,
              ["decrypt"]
            );
          });
      };

      // 密文布局：前 12 字节是本次加密的随机 IV，其余是 GCM 密文（含 16 字节认证标签）
      var fetchDecrypt = function (key, url) {
        return fetch(url, { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("无法获取加密资源 " + url + "（HTTP " + res.status + "）");
            return res.arrayBuffer();
          })
          .then(function (buf) {
            var all = new Uint8Array(buf);
            var iv = all.subarray(0, 12);
            return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, all.subarray(12));
          })
          .then(function (plain) { return new TextDecoder().decode(plain); });
      };

      var removeGateWhenMounted = function () {
        var app = document.getElementById("app");
        var started = Date.now();
        var tick = function () {
          if ((app && app.childElementCount > 0) || Date.now() - started > 3000) {
            gate.remove();
            return;
          }
          setTimeout(tick, 50);
        };
        tick();
      };

      // 先干净地解密两份资源，全部成功后才注入任何东西：
      // 口令错误时页面保持原样，不会留下半成品状态
      var unlock = function (key, persist) {
        return Promise.all([fetchDecrypt(key, CSS_ENC), fetchDecrypt(key, JS_ENC)]).then(function (parts) {
          var style = document.createElement("style");
          style.textContent = parts[0];
          document.head.appendChild(style);

          var script = document.createElement("script");
          // 用 module 而非 classic script：bundle 里可能有 import.meta，在非模块里是语法错误
          script.type = "module";
          // 用 textContent 而非 HTML 字符串拼接：不会被 HTML 解析破坏
          script.textContent = parts[1];
          document.head.appendChild(script);

          removeGateWhenMounted();

          return persist
            ? dbPut(KEY_ID, key).catch(function (e) {
                console.warn("口令记忆失败，下次仍需输入：", e);
              })
            : null;
        });
      };

      var submit = function () {
        var pass = input.value;
        if (!pass) return;
        btn.disabled = true;
        input.disabled = true;
        setMsg("正在解密…", false);
        deriveKey(pass)
          .then(function (key) { return unlock(key, true); })
          .then(function () {})
          .catch(function (e) {
            // 口令错误与密文被篡改都表现为 OperationError
            setMsg("口令错误", true);
            input.value = "";
            input.focus();
            console.error("解锁失败：", e);
          })
          .then(function () {
            btn.disabled = false;
            input.disabled = false;
          });
      };

      var showGate = function () {
        gate.style.display = "flex";
        if (input) { input.focus(); }
        btn.addEventListener("click", submit);
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });

        // 显示 / 隐藏口令。图标在两套之间切，aria-label 同步跟上。
        var toggle = document.getElementById("gate-toggle");
        if (toggle) {
          toggle.addEventListener("click", function () {
            var toText = input.type === "password";
            input.type = toText ? "text" : "password";
            toggle.innerHTML = toText
              ? '<i class="fa fa-eye-slash" aria-hidden="true"></i>'
              : '<i class="fa fa-eye" aria-hidden="true"></i>';
            toggle.setAttribute("aria-label", toText ? "隐藏口令" : "显示口令");
            input.focus();
          });
        }
      };

      var startup = function () {
        if (!window.crypto || !crypto.subtle) {
          showGate();
          setMsg("当前环境不支持 WebCrypto，需要通过 https 或 localhost 访问", true);
          return;
        }
        dbGet(KEY_ID)
          .catch(function (e) { console.warn("读取已存密钥失败：", e); return null; })
          .then(function (stored) {
            if (!stored) { showGate(); return; }
            return unlock(stored, false).catch(function () {
              // 密钥失效或密文已换（重新构建过），清掉重来
              return dbDel(KEY_ID).catch(function () {}).then(showGate);
            });
          })
          .catch(function (e) {
            console.error("启动失败：", e);
            showGate();
            setMsg("启动失败：" + (e && e.message ? e.message : e), true);
          });
      };

      startup();
    </script>
</body>

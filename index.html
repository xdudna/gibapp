<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script>
      try {
        var opts = JSON.parse(localStorage.getItem('localOptions') || '{}');
        if (opts.darkMode) {
          document.documentElement.classList.add('dark');
          document.write('<style>body{background-color:#1a1a2e!important;color:#e0e0e0;}</style>');
        }
        // 转圈用用户自己的强调色，免得一个蓝 spinner 闪现在紫色主题的应用上。
        // 与 index.html 里那段是同一处理 —— 遮罩在 #app 外面，继承不到 .app-root 的变量。
        if (opts.accentColor) {
          document.documentElement.style.setProperty('--boot-accent', opts.accentColor);
        }
      } catch(e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 启动遮罩的样式与标记都不在这里手写第二份，而是由 encrypt-dist.mjs
         从源码 index.html 里按标记提取后注入。一份源、两处生效，样式不会跑偏。
         注意：注释里**不能**写出那两个占位符的字面名字（含双下划线的那串）。
         替换是全字符串替换，写在注释里也会被替掉，于是整块遮罩（连同它自己的
         注释）被注进这条注释内部，里面的结束标记会提前关掉它 —— 注释文字漏到页面上，
         而且遮罩会出现两份，getElementById 只藏得掉第一份，看上去就是永久卡在载入中。
         下面两处占位符是它们唯一该出现的位置。 -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg, #f8f9fb);
        color: #4a5366;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        transition: opacity 0.24s ease;
      }
      /* 底色走自定义属性，而不是在这里直接写 background。
         下面收尾那条 #boot-loader.is-revealing 要把它改成 transparent，
         但 #boot-loader.is-revealing（1 个 id + 1 个类）压不过
         html.dark #boot-loader（1 个 id + 1 个类 + 1 个元素）——
         深色主题下底色会退不掉，绿圈一直蒙在那层底上。
         拆成「谁提供颜色」和「谁使用颜色」之后，两边不再抢同一个属性。 */
      html.dark #boot-loader {
        --boot-bg: #1a1a2e;
        color: #b9c0cc;
      }
      #boot-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* 遮罩上那一行阶段文案。
         绝对定位而不是跟着 flex 排版：#boot-loader 是 column + 居中，文字若参与
         排版会把那枚 64px 的圈连带顶上去十几像素，而绿圈撑开的起点必须与它
         几何重合（见下面 boot-burst 那段），差十几像素就看得出来。
         44 = 圈半径 32 + 12 间距，所以它始终贴在圈的正下方。
         top 用 50% 而不是 center：这个盒子的定位基准是铺满整屏的 #boot-loader，
         50% 就是屏幕中线，也就是圈的圆心。 */
      .boot-loader__text {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + 44px);
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.02em;
        /* 比转圈弱一档：它是说明，不是主角。颜色继承 #boot-loader 的前景色，
           再用透明度压下去 —— 深色模式下两个主题各自给的那档前景色都还在。 */
        opacity: 0.72;
        /* 换文案时不要抖动：文案宽度不一，居中定位本身不抖，但行高要钉住 */
        line-height: 1.4;
        white-space: nowrap;
      }

      .boot-loader__mark {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-loader__mark img {
        width: 32px;
        height: 32px;
      }
      /* 加载圈：主题色的一段弧在匀速自转（就是原来那个「转圈」）。
         用 SVG 而不是 border 技巧，是为了下一拍 —— 就绪时要把这段弧**补齐成整圈**，
         弧长得能连续变化；border 只能染出固定的一段，做不到这件事。
         长度单位：circle 上写了 pathLength="100"（见 HTML 块），
         于是「四分之一圈」就是「实线 25、空 75」，比写 2πr≈188.5 直观得多。 */
      .boot-loader__ring {
        position: absolute;
        inset: 0;
        width: 64px;
        height: 64px;
        border-radius: 50%;
      }
      .boot-loader__track {
        fill: none;
        stroke: rgba(128, 128, 128, 0.18);
        stroke-width: 3;
      }
      .boot-loader__fill {
        fill: none;
        stroke: var(--boot-accent, #409eff);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 25 75;
        /* 绕自己圆心转。SVG 元素的 transform-origin 默认参考 viewBox，
           写 fill-box + center 更直接：绕这一条弧自己的中心转，与 viewBox 无关 */
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-spin 1.1s linear infinite;
        /* 就绪后只改下面那两个值，走过渡而不是关键帧：
           关键帧会从固定起点重放，过渡才能从「此刻画到哪儿」自然接上。
           时长必须与 src/utils/bootLoader.js 里的 COMPLETE_MS 一致。 */
        transition: stroke-dasharray 0.6s ease-in-out, stroke 0.6s ease-in-out;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      /* ── 就绪：慢慢把弧补齐成整圈，并在补齐的过程中变绿 ──────────────────
         绿 = 「好了」，与页脚那条成功回执是同一套语义。
         绿色 #4f9d2f：浅底 3.22:1、深底 5.03:1，都过 WCAG 图形对比度的 3:1，
         所以两种主题共用这一个值，不必再写深色变体。
         自转不停：补齐的同时还在转，弧看起来是「边转边合拢」。
         转到后来整圈合上了，转不转也就看不出来了，所以不用专门去停。
         另外加一圈很淡的光晕，「亮了」这件事才不只是颜色变化。 */
      #boot-loader.is-done .boot-loader__fill {
        stroke: #4f9d2f;
        stroke-dasharray: 100 0;
      }
      #boot-loader.is-done .boot-loader__ring {
        box-shadow: 0 0 0 5px rgba(79, 157, 47, 0.16);
        transition: box-shadow 0.6s ease-in-out;
      }

      /* ── 收尾：绿圈撑开，页面随后落定 ──────────────────────────────────
         分两件事同时发生：

         1) 遮罩退的是**底色**，不是整层的 opacity。
            整理层淡出会把里面的绿圈一起淡掉，而这 0.62s 里绿圈正要从
            63px 撑到盖住整屏 —— 一路蒙着一层减淡的纱，撑得再远也不亮。
            所以退底色、单独留圈，圈由 @keyframes 自己在后段淡出。
            整层的 opacity 留到最后（BURST_MS 之后）才动，那时圈已经是 0 了。

         2) 圈从原地撑开。这里必须是「撑开」而不是「换一个更大的圈」：
            观感上它得像是那枚刚补满的绿圈自己张开，所以起点几何要和
            上面那段弧**完全重合** —— 边框的中线要正好落在 r=30 那个圆上。
            见下面 width/height 的取值注释。 */
      .boot-loader__burst {
        position: absolute;
        left: 50%;
        top: 50%;
        /* 用 translate 居中，不用负 margin：
           下面动的是 width/height，用负 margin 就得连 margin 一起动。 */
        transform: translate(-50%, -50%);
        /* 63 = 上面那枚弧的外径（中线 r=30，两侧各 1.5 的线宽）。 */
        width: 63px;
        height: 63px;
        /* 线宽写成边框，是整个做法成立的关键 —— 为什么不用 SVG 缩放见下面
           HTML 块里的注释（实测过，会变成 58px 的粗带）。
           CSS 边框的粗细与盒子尺寸无关，撑到多大都还是 3px。 */
        border: 3px solid #4f9d2f;
        border-radius: 50%;
        box-sizing: border-box;
        opacity: 0;
        pointer-events: none;
      }
      /* 撑到多大由 bootLoader.js 按视口对角线算好，写在 --boot-burst-size 上。
         写死一个大数也能盖住屏幕，但圈会过早冲出视口、剩下的时间在屏外空跑，
         看上去只是「唰」一下，谈不上扫过。按需要多大给多大才有那个过程。

         代价：动 width/height 会触发布局与重绘（transform 本来可以只走合成）。
         接受它的理由是正确性 —— 这是唯一能保证线宽恒定的写法，
         而这一段只有 0.62s、只有一个脱离文档流的元素，布局代价可以忽略。

         55% 那一帧只管 opacity：关键帧按属性生效，这一帧没提 width/height，
         尺寸照旧从 0% 一口气走到 100%。
         0.55 × 0.62s ≈ 0.34s，配上 ease-in-out，那时圈正好走到一半路程
         （直径已越过屏幕上下边），从这里开始一边扫一边散去。 */
      @keyframes boot-burst {
        0% {
          opacity: 1;
          width: 63px;
          height: 63px;
        }
        55% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          width: var(--boot-burst-size, 1600px);
          height: var(--boot-burst-size, 1600px);
        }
      }

      #boot-loader.is-revealing {
        background: transparent;
        pointer-events: none;
        /* opacity 这条是给最后那记收尾用的：整层淡出时别硬切 */
        transition: background-color 0.34s ease, opacity 0.24s ease;
      }
      /* 图标、那段弧、以及那行阶段文案让位给撑开的圈，0.12s 就走完 ——
         它可以快，因为它和圈是同一个圆、同一个位置，重叠期看不出交接。
         文案也一起走：底色退去之后它就没有承载物了，留着会浮在页面上。 */
      #boot-loader.is-revealing .boot-loader__mark,
      #boot-loader.is-revealing .boot-loader__text {
        opacity: 0;
        transition: opacity 0.12s linear;
      }
      #boot-loader.is-revealing .boot-loader__burst {
        /* 缓动是 ease-in-out，不是页面进场那条 ease-out —— 两件事的节奏本来就不同。
           圈是「扫过去」，全程都该看得见：用 ease-out 的话它在前 35% 就把屏幕走完，
           剩下四成时长在屏外空跑（实测：375ms 时圈已经越过四角）。
           ease-in-out 让它在整段里匀速-ish 地走完，起手那一点点慢正好是
           「刚补满、吸一口气再张开」。
           内容的淡入反过来该用 ease-out：它要的是「快些出现」，不是「匀速」。
           两条曲线一起起步、一起结束，只是内部节奏不同。 */
        animation: boot-burst 0.62s cubic-bezier(0.4, 0, 0.6, 1) forwards;
      }

      /* 页面这边：淡入比缩放先结束（48% 处就到 1）。
         两个一起停会显得后半段只是「还在动」，分开才有「已经好了、只是还没站稳」的层次。
         起点 1.015 是**放大**，所以内容是「收回来」的 —— 与圈向外张开同一个方向：
         圈往外推，内容往里落。
         代价是文档会短暂多出约 0.75vh 的可滚动溢出（transform 不影响布局，
         但算作可滚动溢出），所以下面要锁一下滚动，见 html.is-boot-revealing。 */
      #app.is-booting-in {
        animation: boot-page-in 0.62s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      @keyframes boot-page-in {
        0% {
          opacity: 0;
          transform: scale(1.015);
        }
        48% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* 收尾这 0.6s 锁住文档滚动。
         上面 #app 放大到 1.015，纵向会溢出视口约 0.75vh —— 视口右侧会闪出一条
         纵向滚动条，内容跟着横移十几像素，比动效本身还显眼。
         应用本身是 100vh + 内部滚动，文档层本来就没有可滚的东西，
         锁这一下不会挡住任何操作；而且它只在这 0.6s 内存在。
         由 bootLoader.js 在收尾开始时挂上、进场结束时摘掉。 */
      html.is-boot-revealing,
      html.is-boot-revealing body {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        /* 转圈与补齐都是动效。这里只放慢，不取消 ——
           它是加载中唯一的反馈，取消了就成了完全不动的画面。
           （JS 侧对减动效会直接淡出，不会等这个补齐） */
        .boot-loader__fill {
          animation-duration: 2.6s;
          transition: none;
        }
        /* 撑开是纯粹的装饰，减动效下直接不做。
           JS 那条分支本来就走不到这里，写上是防止以后有人改了 JS 的判定。 */
        .boot-loader__burst {
          display: none;
        }
        #app.is-booting-in {
          animation: none;
        }
      }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#1a1a2e] min-h-screen">
    <div id="gate" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:100000;display:none"
         class="bg-gray-50 dark:bg-[#1a1a2e] flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-white dark:bg-[#252536] rounded-xl shadow-lg p-8">
        <h1 class="text-xl font-bold mb-5 text-gray-700 dark:text-gray-200">请输入口令</h1>
        <input id="gate-input" type="password" autocomplete="current-password" spellcheck="false"
               class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-transparent text-gray-800 dark:text-gray-100 outline-none focus:border-[#3399cc]">
        <button id="gate-btn"
                class="w-full mt-3 px-4 py-2 rounded bg-[#3399cc] text-white hover:opacity-90 disabled:opacity-50">解锁</button>
        <div id="gate-msg" class="mt-3 text-sm text-red-500" style="min-height:1.25rem"></div>
        <div class="mt-2 text-[11px] text-gray-300 dark:text-gray-600 text-right">REL_20261008_110635_3AA3AF7A</div>
      </div>
    </div>
    <div id="app" class="dark:bg-[#1a1a2e]"></div>

    <!-- 启动遮罩（由 encrypt-dist.mjs 从源码 index.html 提取注入）。
         为什么线上需要它：解锁成功后口令会存进 IndexedDB，之后每次打开都走
         「已存密钥」那条分支 —— 那条分支不显示口令卡片，而 PBKDF2 60 万次派生
         ＋拉取并解密两份 .enc 要一两秒，这段时间页面上原本**什么都没有**。
         现在遮罩从第一帧就在，口令卡片出现时它的不透明底会把遮罩盖住，
         应用挂载后由 bundle 里的 bootLoader.js 把它淡出。 -->
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="boot-loader__mark">
        <img src="./favicon.ico" alt="" />
        <svg class="boot-loader__ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="boot-loader__track" cx="32" cy="32" r="30"></circle>
          <!-- pathLength="100" 把周长归一化成 100：
               于是 CSS 里「四分之一圈」就是 stroke-dasharray: 25 75，
               不必去算 2πr，改半径也不用回来重算 -->
          <circle class="boot-loader__fill" cx="32" cy="32" r="30" pathLength="100"></circle>
        </svg>
      </div>
      <!-- 遮罩上的那一行字。阶段由 js 按**真实**的推进改（见 utils/bootLoader.js），
           这里只是初始值：HTML 解析出来就在，代表「页面本身还在路上」。
           它绝对定位、不参与居中排版 —— 参与的话会把上面那枚 64px 的圈顶上去，
           而绿圈撑开的起点必须与那枚圈几何重合（见下面 boot-burst 的说明）。 -->
      <div class="boot-loader__text" id="boot-loader-text">正在获取页面…</div>
      <!-- 收尾时从那枚补满的绿圈原地撑开的一张圈。
           单独一个元素、不复用上面那枚：上面那枚是「一段会变长的弧」（靠
           stroke-dasharray 和自转），这枚是「一个整圈在放大」，两者要同时存在
           才能交叠着换手。

           它是一个带边框的圆 div，不是 SVG —— 这一点是被实测逼出来的：
           最初用 SVG 画圆、给 circle 挂 vector-effect="non-scaling-stroke"，
           外层 <svg> 上挂 transform: scale()。结果是 3px 的线宽跟着一起放大，
           在 1280×800（倍数 28）下量到 0.3 进度时线宽已经变成 **58px**，
           圈成了一条粗带。
           原因：non-scaling-stroke 抵消的是**视框内部**的坐标缩放
           （viewBox、SVG 内部的 g/transform），对贴在 <svg> 元素本身上的
           CSS transform 不起作用 —— 那是在整个 SVG 渲染完之后再对结果缩放。
           用 CSS 边框就没有这回事：边框粗细与盒子尺寸无关，撑到多大都是 3px，
           代价是动 width/height 会触发布局（见 CSS 里那段注释）。

           颜色写死成补齐后的那个绿，不再跟 --boot-accent：
           它接的是「就绪」这个结论，和上面那段弧补齐后的颜色是同一件事。 -->
      <div class="boot-loader__burst"></div>
    </div>

    <script>
      // ── 由 scripts/encrypt-dist.mjs 在构建时替换的常量 ───────────────────────
      var JS_ENC = "./assets/index-e3028abd.js.enc";
      var CSS_ENC = "./assets/index-d15dc3e6.css.enc";
      var SALT_B64 = "Z2liLWhlbHBlci1nYXRlMQ==";
      var ITERATIONS = 600000;
      // ─────────────────────────────────────────────────────────────────────

      var gate = document.getElementById("gate");
      var input = document.getElementById("gate-input");
      var btn = document.getElementById("gate-btn");
      var msg = document.getElementById("gate-msg");

      var DB_NAME = "appGate", STORE = "keys", KEY_ID = "key";

      var setMsg = function (text, isError) {
        msg.textContent = text;
        msg.className = isError ? "mt-3 text-sm text-red-500" : "mt-3 text-sm text-gray-500";
      };

      var b64ToBytes = function (b64) {
        var bin = atob(b64), out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      };

      var openDb = function () {
        return new Promise(function (resolve, reject) {
          var req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      };

      var dbGet = function (key) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var r = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
            r.onsuccess = function () { resolve(r.result); };
            r.onerror = function () { reject(r.error); };
          });
        });
      };

      var dbPut = function (key, value) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE, "readwrite");
            tx.objectStore(STORE).put(value, key);
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        });
      };

      var dbDel = function (key) {
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE, "readwrite");
            tx.objectStore(STORE).delete(key);
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        });
      };

      var deriveKey = function (passphrase) {
        var enc = new TextEncoder();
        return crypto.subtle
          .importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"])
          .then(function (base) {
            return crypto.subtle.deriveKey(
              { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: "SHA-256" },
              base,
              // extractable=false：即使存进 IndexedDB，JS 也导不回密钥原始字节
              { name: "AES-GCM", length: 256 },
              false,
              ["decrypt"]
            );
          });
      };

      // 密文布局：前 12 字节是本次加密的随机 IV，其余是 GCM 密文（含 16 字节认证标签）
      var fetchDecrypt = function (key, url) {
        return fetch(url, { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("无法获取加密资源 " + url + "（HTTP " + res.status + "）");
            return res.arrayBuffer();
          })
          .then(function (buf) {
            var all = new Uint8Array(buf);
            var iv = all.subarray(0, 12);
            return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, all.subarray(12));
          })
          .then(function (plain) { return new TextDecoder().decode(plain); });
      };

      var removeGateWhenMounted = function () {
        var app = document.getElementById("app");
        var started = Date.now();
        var tick = function () {
          if ((app && app.childElementCount > 0) || Date.now() - started > 3000) {
            gate.remove();
            return;
          }
          setTimeout(tick, 50);
        };
        tick();
      };

      // 先干净地解密两份资源，全部成功后才注入任何东西：
      // 口令错误时页面保持原样，不会留下半成品状态
      var unlock = function (key, persist) {
        return Promise.all([fetchDecrypt(key, CSS_ENC), fetchDecrypt(key, JS_ENC)]).then(function (parts) {
          var style = document.createElement("style");
          style.textContent = parts[0];
          document.head.appendChild(style);

          var script = document.createElement("script");
          // 用 module 而非 classic script：bundle 里可能有 import.meta，在非模块里是语法错误
          script.type = "module";
          // 用 textContent 而非 HTML 字符串拼接：不会被 HTML 解析破坏
          script.textContent = parts[1];
          document.head.appendChild(script);

          removeGateWhenMounted();

          return persist
            ? dbPut(KEY_ID, key).catch(function (e) {
                console.warn("口令记忆失败，下次仍需输入：", e);
              })
            : null;
        });
      };

      var submit = function () {
        var pass = input.value;
        if (!pass) return;
        btn.disabled = true;
        input.disabled = true;
        setMsg("正在解密…", false);
        deriveKey(pass)
          .then(function (key) { return unlock(key, true); })
          .then(function () {})
          .catch(function (e) {
            // 口令错误与密文被篡改都表现为 OperationError
            setMsg("口令错误", true);
            input.value = "";
            input.focus();
            console.error("解锁失败：", e);
          })
          .then(function () {
            btn.disabled = false;
            input.disabled = false;
          });
      };

      var showGate = function () {
        gate.style.display = "";
        if (input) { input.focus(); }
        btn.addEventListener("click", submit);
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      };

      var startup = function () {
        if (!window.crypto || !crypto.subtle) {
          showGate();
          setMsg("当前环境不支持 WebCrypto，需要通过 https 或 localhost 访问", true);
          return;
        }
        dbGet(KEY_ID)
          .catch(function (e) { console.warn("读取已存密钥失败：", e); return null; })
          .then(function (stored) {
            if (!stored) { showGate(); return; }
            return unlock(stored, false).catch(function () {
              // 密钥失效或密文已换（重新构建过），清掉重来
              return dbDel(KEY_ID).catch(function () {}).then(showGate);
            });
          })
          .catch(function (e) {
            console.error("启动失败：", e);
            showGate();
            setMsg("启动失败：" + (e && e.message ? e.message : e), true);
          });
      };

      startup();
    </script>
</body>
</html>
